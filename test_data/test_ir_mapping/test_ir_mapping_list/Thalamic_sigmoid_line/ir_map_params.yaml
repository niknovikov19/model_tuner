
# Path(s) to the simulation results
fpath_sim_res:
- D:/WORK/Salvador/repo/A1_OUinp/exp_results/batch_ougrid_tc_20x20/batch_result.csv
- D:/WORK/Salvador/repo/A1_OUinp/exp_results/batch_ougrid_ti_20x20/batch_result.csv
- D:/WORK/Salvador/repo/A1_OUinp/exp_results/batch_ougrid_ire_20x20/batch_result.csv

# Names of the parameters that vary in the batch
batch_param_names:
- ou_mean
- ou_std

# Batch parameter that parametrizes 1-d slice of 2-d matrix
batch_param_main: ou_mean

# Method of slicing the firing rate matrix to get 1-d data
slice_method: batch_param_linear
batch_param_ratio: 0.4
batch_param_intercept: 0.005

# Grid used for interpolation
batch_param_grid:
  ou_mean:
  - -0.03
  - 0.04
  - 250
  ou_std:
  - 0
  - 0.04
  - 250

# I-R mapping type and hyperparameters
map_type: sigmoid_1d_line
map_params:
  x_limits:
  - -.inf
  - .inf
  y_limits:
  - 0
  - .inf

# Fitting bounds for I-R mapping parameters
fit_param_bounds: {}

# Limits for the input rates used for fitting
inp_limits:
  HTC:
  - -0.01
  - 0.01
  IRE:
  - -0.015
  - 0.01
  IREM:
  - -0.015
  - 0.01
  TC:
  - -0.01
  - 0.01
  TCM:
  - -0.01
  - 0.01
  TI:
  - -0.01
  - 0.01
  TIM:
  - -0.01
  - 0.01

# Parameters of the formula that determines the fitting weights
use_fit_weights: false 
fit_weight_pow: 0.5
fit_weight_limits:
- 0.1
- 10

# Parameters of the fitting algorithm
map_fit_params:
  ftol: 0.0001
  max_nfev: 2000
  method: trf
  par0_kprev: 0
  return_first_guess: false
  verbose: false
  xtol: null

pop_names:
- TC
- TCM
- HTC
- IRE
- IREM
- TI
- TIM
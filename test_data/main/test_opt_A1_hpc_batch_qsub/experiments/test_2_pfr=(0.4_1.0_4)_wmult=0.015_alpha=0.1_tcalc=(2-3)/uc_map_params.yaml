# Parameters of the simulation result processing
spikes_calc_params:   # sim_result -> spikes
  combine_cells: true
  ms: false
  ndigits: 6
  pop_names:
    - NGF1
    - NGF2
    - NGF3
    - NGF4
    - NGF5A
    - NGF5B
    - NGF6
    - SOM2

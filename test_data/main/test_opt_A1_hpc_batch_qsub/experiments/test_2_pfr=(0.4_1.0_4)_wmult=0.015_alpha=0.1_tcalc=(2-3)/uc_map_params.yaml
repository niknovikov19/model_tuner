    - CT5A
    - CT5B
    - CT6
    - TC
    - TCM
    - HTC
    - IRE
    - IREM
    - TI
    - TIM
  subtract_t0: true
  time_limits:
  - 0
  - null
rates_calc_params:    # spikes -> rates
  pop_names: null
  time_limits:
  - 2
  - null

# U-C mapping type and hyperparameters
map_type: richards_1d
map_params:
  x_limits:
  - 0
  - .inf
  y_limits:
  - 0
  - .inf

# Fitting bounds for U-C mapping parameters
fit_param_bounds:
  a:
  - 0
  - .inf
  q:
  - 1
  - 30

# Limits for the input rates used for fitting
inp_limits: null

# Parameters of the formula that determines the fitting weights
use_fit_weights: false
fit_weight_pow: 0
fit_weight_limits:
  - 0
  - .inf

# Parameters of the fitting algorithm
map_fit_params:
  ftol: 0.01
  max_nfev: 2000
  method: trf
  par0_kprev: 0
  return_first_guess: false
  verbose: false
  xtol: null

